name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main, feat/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format source
        run: cargo fmt --all

      - name: Upload rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-source
          path: |
            crates/aethel-check/src/lib.rs
            crates/aethel-check/src/sound_checker
            crates/aethel-interpreter/src/lib.rs
            crates/aethel-interpreter/src/sound_eval.rs
          if-no-files-found: error

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release CLI
        run: cargo build --release -p aethel-cli

      - name: Run unit tests
        run: cargo test --workspace --all-features

      - name: Run integration tests
        run: cargo test -p aethel-cli --test integration_test --release

      - name: "✅ valid_verified.aet → type checks"
        run: ./target/release/aethel-cli check examples/refund/valid_verified.aet

      - name: "❌ invalid_unverified.aet → AE-EPISTEMIC-001"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli check examples/refund/invalid_unverified.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0
          echo "$OUTPUT" | grep -q "AE-EPISTEMIC-001"

      - name: "✅ valid_verified.aet run → No policy violations"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Interpreter: valid program passes"

      - name: "✅ valid_verified.aet --trace → effect trace"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet --trace 2>&1 | grep -q "Effect Trace"
          echo "✅ Effect trace present"

      - name: "❌ runtime violation → non-zero exit"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli run examples/runtime_violation.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0

      - name: "✅ full_pipeline.aet → 0 violations"
        run: |
          ./target/release/aethel-cli run examples/full_pipeline.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Full pipeline passes"

      - name: "✅ full_pipeline.aet --trace → log_action + execute"
        run: |
          OUTPUT=$(./target/release/aethel-cli run examples/full_pipeline.aet --trace 2>&1)
          echo "$OUTPUT" | grep -q "log_action"
          echo "$OUTPUT" | grep -q "execute"
          echo "✅ Both effects in trace"

      - name: "✅ emit-ir → valid JSON"
        run: |
          ./target/release/aethel-cli emit-ir examples/refund/valid_verified.aet 2>&1 | python3 -c "import json,sys; json.load(sys.stdin); print('✅ Valid JSON')"

      - name: "✅ pipeline tests"
        run: cargo test -p aethel-check pipeline_test --release

      - name: "❌ breaker tests → exact diagnostics"
        shell: bash
        run: |
          set +e
          FAILURES=0

          expected_pattern() {
            case "$1" in
              breaker-001-*) echo 'AE-EPISTEMIC-001' ;;
              breaker-002-*) echo 'AE-EPISTEMIC-001' ;;
              breaker-003-*) echo 'AE-NAME-002' ;;
              breaker-004-*) echo 'AE-NAME-003' ;;
              breaker-005-*) echo 'AE-PARSE-00[12]' ;;
              breaker-006-*) echo 'AE-PARSE-00[12]|AE-TYPE-003' ;;
              breaker-007-*) echo 'AE-TYPE-001' ;;
              breaker-008-*) echo 'AE-EPISTEMIC-001' ;;
              *) echo 'NEVER_MATCH' ;;
            esac
          }

          for f in examples/breakers/*.aet; do
            NAME=$(basename "$f")
            EXPECTED=$(expected_pattern "$NAME")
            OUTPUT=$(./target/release/aethel-cli check "$f" 2>&1)
            STATUS=$?

            echo "── $NAME"
            if [ $STATUS -eq 0 ]; then
              echo "❌ SHOULD HAVE FAILED"
              FAILURES=$((FAILURES+1))
              continue
            fi

            if echo "$OUTPUT" | grep -Eq "$EXPECTED"; then
              echo "✅ rejected with expected diagnostic: $EXPECTED"
            else
              echo "❌ wrong failure; expected: $EXPECTED"
              echo "$OUTPUT"
              FAILURES=$((FAILURES+1))
            fi
          done

          if [ $FAILURES -ne 0 ]; then
            echo "❌ $FAILURES breaker test(s) failed"
            exit 1
          fi
          echo "✅ All breakers caught for the right reason"
