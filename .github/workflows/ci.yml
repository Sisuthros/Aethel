name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main, feat/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release CLI
        run: cargo build --release -p aethel-cli

      - name: Run unit tests
        run: cargo test --workspace --all-features

      - name: Run integration tests
        run: cargo test -p aethel-cli --test integration_test --release

      - name: "✅ valid_verified.aet → type checks"
        run: ./target/release/aethel-cli check examples/refund/valid_verified.aet

      - name: "❌ invalid_unverified.aet → AE-EPISTEMIC-001"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli check examples/refund/invalid_unverified.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0
          echo "$OUTPUT" | grep -q "AE-EPISTEMIC-001"

      - name: "✅ valid_verified.aet run → No policy violations"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Interpreter: valid program passes"

      - name: "✅ valid_verified.aet --trace → effect trace"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet --trace 2>&1 | grep -q "Effect Trace"
          echo "✅ Effect trace present"

      - name: "❌ runtime violation → non-zero exit"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli run examples/runtime_violation.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0

      - name: "✅ full_pipeline.aet → 0 violations"
        run: |
          ./target/release/aethel-cli run examples/full_pipeline.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Full pipeline passes"

      - name: "✅ full_pipeline.aet --trace → log_action + execute"
        run: |
          OUTPUT=$(./target/release/aethel-cli run examples/full_pipeline.aet --trace 2>&1)
          echo "$OUTPUT" | grep -q "log_action"
          echo "$OUTPUT" | grep -q "execute"
          echo "✅ Both effects in trace"

      - name: "✅ emit-ir → valid JSON"
        run: |
          ./target/release/aethel-cli emit-ir examples/refund/valid_verified.aet 2>&1 | python3 -c "import json,sys; json.load(sys.stdin); print('✅ Valid JSON')"

      - name: "✅ pipeline tests"
        run: cargo test -p aethel-check pipeline_test --release

      - name: "❌ required breakers → exact diagnostics"
        shell: bash
        run: |
          set +e
          FAILURES=0
          echo "Required breakers (examples/breakers/required.tsv):"
          while IFS=$'\t' read -r FIXTURE EXPECTED; do
            [ "$FIXTURE" = "fixture" ] && continue
            [ -z "$FIXTURE" ] && continue
            F="examples/breakers/$FIXTURE"
            OUTPUT=$(./target/release/aethel-cli check "$F" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "  ❌ $FIXTURE PASSED (must fail)"
              FAILURES=$((FAILURES+1))
              continue
            fi
            if echo "$OUTPUT" | grep -q "$EXPECTED"; then
              echo "  ✅ $FIXTURE → $EXPECTED"
            else
              FIRST=$(echo "$OUTPUT" | grep -oP 'AE-\w+-\d+' | head -1)
              echo "  ❌ $FIXTURE expected $EXPECTED, got ${FIRST:-no code}"
              FAILURES=$((FAILURES+1))
            fi
          done < examples/breakers/required.tsv
          echo ""
          echo "Known gaps (examples/breakers/known-gaps.tsv):"
          while IFS=$'\t' read -r FIXTURE REASON; do
            [ "$FIXTURE" = "fixture" ] && continue
            [ -z "$FIXTURE" ] && continue
            F="examples/breakers/$FIXTURE"
            OUTPUT=$(./target/release/aethel-cli check "$F" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              echo "  ✅ $FIXTURE XFAIL — $REASON"
            else
              echo "  ❗ $FIXTURE XPASS (unexpected rejection) — $REASON"
              FAILURES=$((FAILURES+1))
            fi
          done < examples/breakers/known-gaps.tsv
          echo ""
          if [ $FAILURES -ne 0 ]; then echo "❌ $FAILURES failure(s)"; exit 1; fi
          printf "✅ required breakers: 20/20 PASS\n   known gaps: 0 XFAIL\n"
