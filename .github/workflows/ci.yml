name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build CLI
        run: cargo build --release -p aethel-cli

      - name: Test vertical slice - invalid
        run: |
          cargo run --release -p aethel-cli -- check examples/refund/invalid_unverified.aet
          # Should fail with AE-EPISTEMIC-001

      - name: Test vertical slice - valid
        run: |
          cargo run --release -p aethel-cli -- check examples/refund/valid_verified.aet
          # Should pass