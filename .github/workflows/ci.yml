name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | grep -v "warning:" || true

      - name: Run unit tests
        run: cargo test --workspace --all-features

      - name: Build release CLI
        run: cargo build --release -p aethel-cli

      # ── Vertical slice tests ────────────────────

      - name: "✅ valid_verified.aet → type checks"
        run: cargo run --release -p aethel-cli -- check examples/refund/valid_verified.aet

      - name: "❌ invalid_unverified.aet → AE-EPISTEMIC-001"
        run: |
          set +e
          cargo run --release -p aethel-cli -- check examples/refund/invalid_unverified.aet
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "❌ Expected exit code 1 (type error), got 0"
            exit 1
          fi
          echo "✅ Correctly rejected (exit code $EXIT_CODE)"

      - name: "✅ valid_verified.aet run → 2 claims, 2 verified, 0 violations"
        run: |
          cargo run --release -p aethel-cli -- run examples/refund/valid_verified.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Interpreter: valid program passes"

      - name: "✅ valid_verified.aet --trace → effect trace"
        run: |
          cargo run --release -p aethel-cli -- run examples/refund/valid_verified.aet --trace 2>&1 | grep -q "effect \`refund\`"
          echo "✅ Effect trace present"

      - name: "✅ simple let/test compiles"
        run: |
          echo "fn main() { let x = 42; }" > /tmp/simple.aet
          cargo run --release -p aethel-cli -- check /tmp/simple.aet

      - name: "✅ pipeline tests — non-empty IR"
        run: cargo test -p aethel-check pipeline_test

      - name: "✅ all interpreter tests green"
        run: cargo test -p aethel-interpreter --release
