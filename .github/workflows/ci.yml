name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main, feat/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release CLI
        run: cargo build --release -p aethel-cli

      - name: Run unit tests
        run: cargo test --workspace --all-features

      - name: Run integration tests
        run: cargo test -p aethel-cli --test integration_test --release

      - name: "✅ valid_verified.aet → type checks"
        run: ./target/release/aethel-cli check examples/refund/valid_verified.aet

      - name: "❌ invalid_unverified.aet → AE-EPISTEMIC-001"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli check examples/refund/invalid_unverified.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0
          echo "$OUTPUT" | grep -q "AE-EPISTEMIC-001"

      - name: "✅ valid_verified.aet run → No policy violations"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Interpreter: valid program passes"

      - name: "✅ valid_verified.aet --trace → effect trace"
        run: |
          ./target/release/aethel-cli run examples/refund/valid_verified.aet --trace 2>&1 | grep -q "Effect Trace"
          echo "✅ Effect trace present"

      - name: "❌ runtime violation → non-zero exit"
        run: |
          set +e
          OUTPUT=$(./target/release/aethel-cli run examples/runtime_violation.aet 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          test $EXIT_CODE -ne 0

      - name: "✅ full_pipeline.aet → 0 violations"
        run: |
          ./target/release/aethel-cli run examples/full_pipeline.aet 2>&1 | grep -q "No policy violations"
          echo "✅ Full pipeline passes"

      - name: "✅ full_pipeline.aet --trace → log_action + execute"
        run: |
          OUTPUT=$(./target/release/aethel-cli run examples/full_pipeline.aet --trace 2>&1)
          echo "$OUTPUT" | grep -q "log_action"
          echo "$OUTPUT" | grep -q "execute"
          echo "✅ Both effects in trace"

      - name: "✅ emit-ir → valid JSON"
        run: |
          ./target/release/aethel-cli emit-ir examples/refund/valid_verified.aet 2>&1 | python3 -c "import json,sys; json.load(sys.stdin); print('✅ Valid JSON')"

      - name: "✅ pipeline tests"
        run: cargo test -p aethel-check pipeline_test --release

      - name: "❌ breaker tests → exact diagnostics"
        shell: bash
        run: |
          set +e

          BREAKERS_DIR="examples/breakers"
          REQUIRED_TSV="$BREAKERS_DIR/required.tsv"
          GAPS_TSV="$BREAKERS_DIR/known-gaps.tsv"

          REQUIRED_PASS=0
          REQUIRED_FAIL=0
          GAP_COUNT=0
          MANIFEST_ERRORS=0

          declare -A KNOWN_FIXTURES

          # --- required.tsv: must be rejected with the exact expected_code ---
          FIRST=1
          while IFS=$'\t' read -r fixture expected_code || [ -n "$fixture" ]; do
            if [ "$FIRST" -eq 1 ]; then FIRST=0; continue; fi
            [ -z "$fixture" ] && continue
            KNOWN_FIXTURES["$fixture"]=1

            OUTPUT=$(./target/release/aethel-cli check "$BREAKERS_DIR/$fixture" 2>&1)
            STATUS=$?

            echo "── $fixture (required, expect $expected_code)"
            if [ "$STATUS" -eq 0 ]; then
              echo "❌ SHOULD HAVE FAILED (exit 0)"
              REQUIRED_FAIL=$((REQUIRED_FAIL+1))
              continue
            fi

            if echo "$OUTPUT" | grep -qF -- "$expected_code"; then
              echo "✅ rejected with expected diagnostic: $expected_code"
              REQUIRED_PASS=$((REQUIRED_PASS+1))
            else
              echo "❌ wrong failure; expected: $expected_code (exit $STATUS)"
              echo "$OUTPUT"
              REQUIRED_FAIL=$((REQUIRED_FAIL+1))
            fi
          done < <(tr -d '\r' < "$REQUIRED_TSV")

          # --- known-gaps.tsv: run for visibility, never fails the build ---
          FIRST=1
          while IFS=$'\t' read -r fixture reason || [ -n "$fixture" ]; do
            if [ "$FIRST" -eq 1 ]; then FIRST=0; continue; fi
            [ -z "$fixture" ] && continue
            KNOWN_FIXTURES["$fixture"]=1

            OUTPUT=$(./target/release/aethel-cli check "$BREAKERS_DIR/$fixture" 2>&1)
            STATUS=$?
            GAP_COUNT=$((GAP_COUNT+1))

            echo "── $fixture (known-gap: $reason)"
            if [ "$STATUS" -eq 0 ]; then
              echo "ℹ️ known-gap: checker accepted (exit 0) — informational only, not a failure"
            else
              echo "ℹ️ known-gap: checker rejected (exit $STATUS) — informational only, not a failure"
            fi
          done < <(tr -d '\r' < "$GAPS_TSV")

          # --- coverage: every breaker-*.aet must be listed in one of the two manifests ---
          for f in "$BREAKERS_DIR"/breaker-*.aet; do
            NAME=$(basename "$f")
            if [ -z "${KNOWN_FIXTURES[$NAME]:-}" ]; then
              echo "❌ $NAME: fixture not in any manifest (required.tsv or known-gaps.tsv)"
              MANIFEST_ERRORS=$((MANIFEST_ERRORS+1))
            fi
          done

          TOTAL_REQUIRED=$((REQUIRED_PASS+REQUIRED_FAIL))
          echo "───────────────────────────────"
          echo "Summary: $REQUIRED_PASS/$TOTAL_REQUIRED required breakers rejected correctly, $GAP_COUNT known-gap fixture(s) (informational), $MANIFEST_ERRORS fixture(s) missing from manifests"

          TOTAL_FAILURES=$((REQUIRED_FAIL + MANIFEST_ERRORS))
          if [ "$TOTAL_FAILURES" -ne 0 ]; then
            echo "❌ $TOTAL_FAILURES failure(s)"
            exit 1
          fi
          echo "✅ All breakers caught for the right reason"
