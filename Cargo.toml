[workspace]
resolver = "2"
members = [
    "crates/aethel-cli",
    "crates/aethel-syntax",
    "crates/aethel-hir",
    "crates/aethel-check",
    "crates/aethel-ir",
    "crates/aethel-interpreter",
    "crates/aethel-runtime",
    "crates/aethel-store-sqlite",
    "crates/aethel-model",
    "crates/aethel-effects",
    "crates/aethel-wasm",
    "crates/aethel-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Aethel Contributors"]
rust-version = "1.85"

[workspace.dependencies]
thiserror = { version = "1.0" }
anyhow = "1.0"
logos = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.0"
smallvec = "1.10"
once_cell = "1.19"
arc-swap = "1.7"
codespan-reporting = "0.11"
insta = { version = "1.34", features = ["json"] }
pretty_assertions = "1.4"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
dprint = "0.5"
tokio = { version = "1.40", features = ["full"] }
blake3 = "1.7"
jiff = { version = "0.8", features = ["tzdb"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints]
clippy.all = "deny"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.panic = "deny"
clippy.todo = "warn"
clippy.unimplemented = "warn"
clippy.missing_docs_in_private_items = "allow"
clippy.missing_errors_doc = "warn"
clippy.missing_panics_doc = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
debug = true